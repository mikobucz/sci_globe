[package]
name = "mathmap"
version = "0.2.0"
edition = "2021"
authors = ["MathMap System Engineering"]
description = "Ultra-high-performance SoA Force-Directed & Spherical Riemann Graph Simulation Engine in Rust + WebAssembly"

[lib]
name = "mathmap"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mathmap-cli"
path = "src/main.rs"

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

